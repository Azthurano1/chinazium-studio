name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and publish Windows updater release
    runs-on: windows-latest
    env:
      VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: 0.4.${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust toolchain for Velopack Flutter
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Windows platform files
        working-directory: app
        run: flutter create --platforms=windows --project-name chinazium_studio .

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool update --global vpk

      # On the first run there is no previous release yet. From the second
      # successful run onward this downloads the last package metadata/assets
      # so vpk pack can create a delta package.
      - name: Download previous release for delta generation
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/Azthurano1/chinazium-studio

      - name: Package application and generate delta
        shell: pwsh
        run: vpk pack --packId ChinaziumStudio --packVersion $env:APP_VERSION --packDir app/build/windows/x64/runner/Release --mainExe chinazium_studio.exe --packTitle "Chinazium Studio" --outputDir Releases --channel win --delta BestSpeed

      - name: Publish versioned GitHub Release
        shell: pwsh
        run: vpk upload github --repoUrl https://github.com/Azthurano1/chinazium-studio --publish --releaseName "Chinazium Studio $env:APP_VERSION" --tag "v$env:APP_VERSION"
