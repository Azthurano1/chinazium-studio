name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        working-directory: app
        run: flutter create --platforms=windows --project-name chinazium_studio .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Package application
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            throw "Windows release output directory was not found: $releaseDir"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "ChinaziumStudio-windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Chinazium Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: ChinaziumStudio-windows-x64.zip
